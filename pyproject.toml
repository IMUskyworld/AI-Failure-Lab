[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faillab"
version = "0.1.1"
description = "Turn AI coding-agent failures into searchable, analyzable, reproducible incident records"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "faillab contributors" }]
keywords = ["ai-agents", "failure-analysis", "incident-database", "reproducibility", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.350",
]

[project.scripts]
faillab = "faillab.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faillab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --color=no"
pythonpath = ["src", "tests"]
markers = [
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF001",  # full-width punctuation is intentional in Chinese user-facing strings
    "RUF002",
    "RUF003",
    "B008",    # typer.Option()/Argument() in defaults is the framework's own idiom
    "UP042",   # `(str, Enum)` is deliberate: pydantic v2 + JSON rendering rely on .value
    "SIM105",  # try/except/pass is clearer than contextlib.suppress at these call sites
]

[tool.ruff.lint.isort]
known-first-party = ["faillab"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnusedExpression = false
